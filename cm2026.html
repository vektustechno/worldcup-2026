<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#f7f5ed;--paper-2:#fbfaf4;--ink:#1e2b22;--rule:#1e2b2259;--green:#2d6b3f;--pen:#2b3b8c;--stamp:#b85e1a}
html{background:var(--paper);font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--paper);background-image:radial-gradient(#1e2b2208 1px,transparent 1px);background-size:7px 7px;padding:0 16px}
#app{max-width:1480px;margin:0 auto;padding:24px 0;min-height:100vh}
.masthead{text-align:center;border-top:6px double var(--ink);border-bottom:2px solid var(--ink);padding:20px 0 16px}
.masthead h1{font-weight:900;text-transform:uppercase;font-size:clamp(1.8rem,6vw,3.5rem);line-height:1.05;margin-top:6px;letter-spacing:-.02em}
.masthead h1 span{display:block;font-size:clamp(.7rem,2vw,.95rem);font-weight:600;letter-spacing:.32em;margin-top:6px;color:var(--green)}
.section-title{text-transform:uppercase;font-weight:800;letter-spacing:.14em;font-size:.85rem;border-bottom:2px solid var(--ink);padding-bottom:5px;margin-bottom:16px}
.section-title::before{content:'■';color:var(--green);margin-right:8px;font-size:.7rem;vertical-align:1px}
.match-card{background:var(--paper-2);border:1px solid var(--ink);padding:7px 10px;box-shadow:3px 3px 0 #1e2b2217;font-size:.8rem}
.final-card{border-width:2px;padding:11px 13px}
.final-card .score{font-size:1.6rem}
.leader{flex:1;min-width:8px;border-bottom:1px dotted var(--rule);transform:translateY(-3px)}
.score{font-weight:700;font-size:1.25rem;color:var(--pen);display:inline-block;transform:rotate(-3deg);min-width:1.2ch;text-align:center;line-height:.9}
.score-sm{font-size:1.05rem}
.match-card:nth-child(even) .score{transform:rotate(2.5deg)}
.pen-score{font-weight:600;font-size:.85rem;color:var(--pen);margin-right:3px}
.stamp-wrap{display:flex;justify-content:center;margin-top:16px}
.stamp{transform:rotate(-5deg);color:var(--stamp);border:3px double var(--stamp);border-radius:4px;padding:8px 18px;text-transform:uppercase;font-weight:900;letter-spacing:.12em;font-size:1.25rem;text-align:center;opacity:.9}
.stamp span{display:block;font-size:.6rem;letter-spacing:.3em;margin-top:3px}
.group-panel{border:1px solid var(--ink);background:var(--paper-2);padding:11px 13px;box-shadow:3px 3px 0 #1e2b2217}
.panel-title{display:inline-block;background:var(--green);color:var(--paper);text-transform:uppercase;font-weight:800;letter-spacing:.16em;font-size:.68rem;padding:3px 10px;margin-bottom:8px}
.q-mark{display:inline-block;border:1px solid var(--green);color:var(--green);border-radius:999px;width:16px;height:16px;line-height:15px;text-align:center;font-size:.6rem;font-weight:800}
.third-cell{display:flex;align-items:baseline;gap:6px;border-bottom:1px dotted var(--rule);padding-bottom:3px;font-size:.78rem}
.bracket-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.3fr 1fr 1fr 1fr 1fr;gap:3px}
.match-completed{background:#e8f5e9!important;border-color:#388e3c!important}
.match-predicted{background:#fff8e1!important;border-color:#f9a825!important}
</style>
</head>

};
const SHORT = {'Bosnia and Herzegovina':'Bosnia & Herz.','United States':'United States'};

function flag(t){return FLAGS[t]||'🏳️'}
function short(t){return SHORT[t]||t}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function ko(T,n){return T.knockout.find(m=>m.m===n)}

function penText(m){
  if(m.db==='penalties') return m.ph+'–'+m.pa+' по пенальти'
  if(m.db==='extra_time') return 'после овертайма'
  return ''
}

function teamLine(team,goals,won,pens){
  var cls=won?'font-weight:700;color:var(--ink)':'opacity:.6;color:var(--ink)'
  var pen=pens!=null?'<span style="font-weight:600;font-size:.85rem;color:var(--pen);margin-right:3px">('+pens+')</span>':''
  return '<div style="display:flex;align-items:baseline;gap:6px;min-width:0">'+
    '<span style="font-size:.9rem;flex-shrink:0">'+flag(team)+'</span>'+
    '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem;'+cls+'">'+esc(short(team))+'</span>'+
    '<span class="leader"></span>'+pen+'<span class="score">'+goals+'</span></div>'
}

function matchCard(m,caption,showNote,extraClass){
  var hw=m.w===m.h
  var tag=penText(m)
  var ic=m.s==='completed'
  var sc=ic?'match-completed':'match-predicted'
  var n=(showNote&&m.n)?'<p style="margin-top:4px;font-size:.68rem;line-height:1.3;font-style:italic;opacity:.75">'+esc(m.n)+'</p>':''
  var d=m.d?'<span style="font-size:.55rem;opacity:.5">'+esc(m.d)+'</span>':''
  var stat=ic?'✓ сыгран':'⚽ прогноз'
  var sc2=ic?'color:#2e7d32':'color:#e65100'
  return '<div class="match-card '+(extraClass||'')+'" style="background:'+(ic?'#e8f5e9':'#fff8e1')+'">'+
    '<div style="display:flex;justify-content:space-between;font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;opacity:.6;margin-bottom:4px">'+
    '<span>M'+m.m+'</span><span>'+esc(caption||'')+'</span></div>'+
    teamLine(m.h,m.hh,hw,m.db==='penalties'?m.ph:null)+
    teamLine(m.a,m.ah,!hw,m.db==='penalties'?m.pa:null)+
    (tag?'<div style="margin-top:4px;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;opacity:.7">'+tag+'</div>':'')+
    n+
    '<div style="display:flex;justify-content:space-between;margin-top:4px">'+d+
    '<span style="font-size:.55rem;text-transform:uppercase;letter-spacing:.05em;'+sc2+'">'+stat+'</span></div></div>'
}

function column(T,nums,caption){
  var h=''
  for(var i=0;i<nums.length;i++) h+=matchCard(ko(T,nums[i]),caption,false,'')
  return '<div style="display:flex;flex-direction:column;justify-content:space-around;gap:6px">'+h+'</div>'
}

function renderBracket(T){
  var f=ko(T,104),t3=ko(T,103)
  var L=BRACKET_LEFT,R=BRACKET_RIGHT
  var html='<div style="overflow-x:auto;-webkit-overflow-scrolling:touch">'
  html+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1.3fr 1fr 1fr 1fr 1fr;gap:3px;min-width:1140px">'
  html+=column(T,L.r32,'1/16')+column(T,L.r16,'1/8')+column(T,L.qf,'1/4')+column(T,L.sf,'1/2')
  html+='<div style="display:flex;flex-direction:column;justify-content:center;gap:20px">'
  html+='<div><p style="text-align:center;font-size:.65rem;text-transform:uppercase;letter-spacing:.25em;margin-bottom:8px;opacity:.7">Финал · MetLife Stadium · 19 июля</p>'
  html+=matchCard(f,'Финал',true,'final-card')
  html+='<div class="stamp-wrap"><div class="stamp">'+flag(T.champion)+' '+esc(T.champion)+'<span>Чемпионы мира 2026</span></div></div></div>'
  html+='<div><p style="text-align:center;font-size:.65rem;text-transform:uppercase;letter-spacing:.25em;margin-bottom:8px;opacity:.7">Матч за 3-е место</p>'
  html+=matchCard(t3,'Бронза',true)+'</div></div>'
  html+=column(T,R.sf,'1/2')+column(T,R.qf,'1/4')+column(T,R.r16,'1/8')+column(T,R.r32,'1/16')
  html+='</div></div>'
  return html
}

function renderGroups(T){
  var q={};for(var i=0;i<T.qualifiedThirds.length;i++) q[T.qualifiedThirds[i]]=true
  var groups=Object.keys(T.groups)
  var html='<div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">'
  for(var g=0;g<groups.length;g++){
    var letter=groups[g],grp=T.groups[letter],st=grp.standings,m=grp.matches
    html+='<div class="group-panel"><h3 class="panel-title">Группа '+letter+'</h3>'
    html+='<table style="width:100%;font-size:.72rem;font-variant-numeric:tabular-nums;text-align:center;border-collapse:collapse">'
    html+='<thead><tr style="font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;opacity:.6"><th></th><th style="text-align:left">Команда</th><th>В</th><th>Н</th><th>П</th><th>Голы</th><th>О</th></tr></thead><tbody>'
    for(var r=0;r<st.length;r++){
      var row=st[r],adv=r<2||(r===2&&q[letter])
      html+='<tr'+(adv?' style="font-weight:600"':' style="opacity:.55"')+'>'
      html+='<td style="padding-right:4px">'+(r+1)+'</td>'
      html+='<td style="text-align:left;width:100%"><span style="margin-right:4px">'+flag(row.team)+'</span>'+esc(short(row.team))+(r===2&&q[letter]?' <span class="q-mark">q</span>':'')+'</td>'
      html+='<td>'+row.w+'</td><td>'+row.d+'</td><td>'+row.l+'</td><td>'+row.gf+':'+row.ga+'</td><td style="font-weight:700">'+row.pts+'</td></tr>'
    }
    html+='</tbody></table><div style="margin-top:8px;padding-top:8px;border-top:1px dotted var(--rule);display:flex;flex-direction:column;gap:4px">'
    for(var r=0;r<m.length;r++){
      var mc=m[r],ic2=mc.status==='completed'
      html+='<div style="display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:4px;font-size:.72rem;align-items:baseline" title="'+esc(mc.note||'')+'">'
      html+='<span style="font-size:.5rem;opacity:.5">'+esc(mc.date||'')+'</span>'
      html+='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">'+flag(mc.home)+' '+esc(short(mc.home))+'</span>'
      html+='<span class="score score-sm" style="text-align:center;min-width:2.5ch">'+mc.homeGoals+'–'+mc.awayGoals+'</span>'
      html+='<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+flag(mc.away)+' '+esc(short(mc.away))+'</span>'
      html+='<span style="font-size:.45rem;text-transform:uppercase;letter-spacing:.05em;text-align:right;'+(ic2?'color:#2e7d32':'color:#e65100')+'">'+(ic2?'✓ сыгран':'⚽ прогноз')+'</span></div>'
    }
    html+='</div></div>'
  }
  html+='</div>'
  return html
}

function renderThirds(T){
  var r=T.thirdPlaceRanking
  var html='<div style="display:grid;gap:8px 24px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">'
  for(var i=0;i<r.length;i++){
    var t=r[i]
    html+='<div style="display:flex;align-items:baseline;gap:6px;border-bottom:1px dotted var(--rule);padding-bottom:3px;font-size:.78rem'+(i>=8?';opacity:.45':'')+'">'
    html+='<span style="font-size:.65rem;opacity:.6">'+(i+1)+'.</span>'
    html+='<span>'+flag(t.team)+'</span>'
    html+='<span style="font-size:.75rem'+(i<8?';font-weight:600':'')+'">'+esc(short(t.team))+'</span>'
    html+='<span style="font-size:.7rem;font-variant-numeric:tabular-nums;opacity:.7">'+t.pts+' pts, '+(t.gf-t.ga>0?'+':'')+(t.gf-t.ga)+'</span>'
    if(i<8) html+='<span class="q-mark">q</span>'
    html+='</div>'
  }
  html+='</div>'
  return html
}

function gh(m){return m.homeGoals!=null?m.homeGoals:m.hh}
function ga(m){return m.awayGoals!=null?m.awayGoals:m.ah}
function ghome(m){return m.home||m.h}
function gaway(m){return m.away||m.a}
function renderStats(T){
  var allm=[];var grps=Object.values(T.groups)
  for(var i=0;i<grps.length;i++) for(var j=0;j<grps[i].matches.length;j++) allm.push(grps[i].matches[j])
  var kom=T.knockout;var all=[].concat(allm,kom)
  var goals=0;for(var i=0;i<all.length;i++) goals+=gh(all[i])+ga(all[i])
  var draws=0;for(var i=0;i<allm.length;i++) if(allm[i].homeGoals===allm[i].awayGoals) draws++
  var pens=0;for(var i=0;i<kom.length;i++) if(kom[i].db==='penalties') pens++
  var aet=0;for(var i=0;i<kom.length;i++) if(kom[i].db==='extra_time') aet++
  var big=all[0],margin=-1
  for(var i=0;i<all.length;i++){var d=Math.abs(gh(all[i])-ga(all[i]));if(d>margin){margin=d;big=all[i]}}
  var data=[['Всего матчей',all.length],['Голы',goals+' ('+(goals/all.length).toFixed(2)+' за матч)'],['Ничьи в группах',draws],['Овертаймы',aet],['Пенальти',pens],['Крупнейшая победа',short(ghome(big))+' '+gh(big)+'–'+ga(big)+' '+short(gaway(big))]]
  var html='<div style="display:grid;gap:4px 32px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));font-size:.8rem">'
  for(var i=0;i<data.length;i++){
    html+='<div style="display:flex;align-items:baseline;gap:8px"><span style="opacity:.7">'+data[i][0]+'</span><span class="leader"></span><span style="font-weight:600;font-variant-numeric:tabular-nums">'+data[i][1]+'</span></div>'
  }
  html+='</div>'
  return html
}
